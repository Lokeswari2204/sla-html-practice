<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Form</title>
</head>
<body>
    <form action="#">
        <h1>Job Application Form</h1>

        <label for="fullname">Full Name: </label> 
        <input type="text" id="fullname" name="fullname"><br><br><br>

        <label for="email">Email ID: </label>
        <input type="email" id="email" name="email"><br><br><br>

        <label for="phone">Phone Number: </label>
        <input type="tel" id="phone" name="phone"><br><br><br>

        <label for="dob">Date of Birth: </label>
        <input type="date" id="dob" name="dob"><br><br><br>

        <label>Gender:  </label>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label><br><br><br>

        <label for="qualification">Qualification: </label>
        <select id="qualification" name="qualification">
            <option value="select">--Select--</option>
            <option value="be/btech">B.E/B.Tech</option>
            <option value="bca">BCA</option>
            <option value="bcom">B.com</option>
            <option value="bsc">Bsc</option>
        </select> <br><br><br>


        <label for="skills">Skills: </label>

        <input type="checkbox" id="sql" name="skills" value="SQL">
        <label for="sql">SQL</label>

        <input type="checkbox" id="python" name="skills" value="Python">
        <label for="python">Python</label>

        <input type="checkbox" id="java" name="skills" value="Java">
        <label for="java">Java</label>

        <input type="checkbox" id="html" name="skills" value="HTML">
        <label for="html">HTML</label>

        <input type="checkbox" id="css" name="skills" value="CSS">
        <label for="css">CSS</label>

        <input type="checkbox" id="js" name="skills" value="Javascript">
        <label for="js">Javascript</label>

        <input type="checkbox" id="asp" name="skills" value="Asp.Net">
        <label for="asp">Asp.Net</label>

        <input type="checkbox" id="ai" name="skills" value="AI/ML">
        <label for="ai">AI/ML</label>

        <br><br><br>

        <label for="yoe">Years of Experience: </label>
        <input type="number" id="yoe" name="yoe"><br><br><br>

        <label for="resume">Upload your Resume: </label> <br><br>
        <input type="file" id="resume" name="resume"><br><br><br>

        <label for="address">Address: </label> <br><br>
        <textarea id="address" name="address" rows="5" cols="40"></textarea><br><br><br>

        <label for="location">Preferred Job Location: </label>
        <select id="location" name="location">
            <option value="select">--Select--</option>
            <option value="chennai">Chennai</option>
            <option value="bangalore">Bangalore</option>
            <option value="hyderabad">Hyderabad</option>
            <option value="mumbai">Mumbai</option>
        </select>
        <br><br><br>
        
        <label for="pwd">Password: </label>
        <input type="password" id="pwd" name="pwd"><br><br><br>
        
        <input type="checkbox" id="agree" name="agree" value="yes">
        <label for="agree">I agree to the Terms and Conditions</label><br><br><br>
        
        <input type="submit" value="Submit">
        <input type="reset" value="Reset">
        


    </form>
</body>
</html>
