<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Course Registration Form</title>
</head>
<body>
    <form action="#">
        <h1>Online Course Registration Form</h1>

        <label for="name">Student Name: </label> 
        <input type="text" id="name" name="name"><br><br><br>

        <label for="email">Email ID: </label>
        <input type="email" id="email" name="email"><br><br><br>

        <label for="phone">Mobile Number: </label>
        <input type="tel" id="phone" name="phone"><br><br><br>

        <label for="dob">Date of Birth: </label>
        <input type="date" id="dob" name="dob"><br><br><br>

        <label>Gender:  </label>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label><br><br><br>

        <label for="course">Select Course: </label>
        <select id="course" name="course">
            <option value="select">--Select--</option>
            <option value="fullstack">Full Stack Development</option>
            <option value="dataanalytics">Data Analytics</option>
            <option value="dataScience">Data Science</option>
            <option value="aws">AWS & DevOps</option>
            <option value="ai/ml">AI/ML</option>
            <option value="cybsersecurity">Cybersecurity</option>
        </select> <br><br><br>

        <label>Learning Mode:  </label>
        <input type="radio" id="online" name="mode" value="online">
        <label for="online">Online</label>
        <input type="radio" id="offline" name="mode" value="offline">
        <label for="offline">Offline</label><br><br><br>


        <label for="skills">Skills Known: </label>

        <input type="checkbox" id="sql" name="skills" value="SQL">
        <label for="sql">SQL</label>

        <input type="checkbox" id="python" name="skills" value="Python">
        <label for="python">Python</label>

        <input type="checkbox" id="java" name="skills" value="Java">
        <label for="java">Java</label>

        <input type="checkbox" id="html" name="skills" value="HTML">
        <label for="html">HTML</label>

        <input type="checkbox" id="css" name="skills" value="CSS">
        <label for="css">CSS</label>

        <input type="checkbox" id="js" name="skills" value="Javascript">
        <label for="js">Javascript</label>

        <input type="checkbox" id="asp" name="skills" value="Asp.Net">
        <label for="asp">Asp.Net</label>

        <input type="checkbox" id="ai" name="skills" value="AI/ML">
        <label for="ai">AI/ML</label>

        <br><br><br>

        <label for="startdate">Course Start Date: </label>
        <input type="date" id="startdate" name="startdate"><br><br><br>

        <label for="photo">Upload Photo: </label> <br><br>
        <input type="file" id="photo" name="photo"><br><br><br>

        <label for="address">Address: </label> <br><br>
        <textarea id="address" name="address" rows="5" cols="40"></textarea><br><br><br>

        <label for="country">Country: </label>
        <select id="country" name="country">
            <option value="select">--Select--</option>
            <option value="india">India</option>
            <option value="usa">USA</option>
            <option value="uk">UK</option>
        </select>
        <br><br><br>

        <label for="username">User Name: </label> 
        <input type="text" id="username" name="username"><br><br><br>
        
        <label for="pwd">Password: </label>
        <input type="password" id="pwd" name="pwd"><br><br><br>

        <label for="cpwd"> Confirm Password: </label>
        <input type="password" id="cpwd" name="cpwd"><br><br><br>
        
        <input type="checkbox" id="agree" name="agree" value="yes">
        <label for="agree">I agree to the Terms and Conditions</label><br><br><br>
        
        <input type="submit" value="Register">
        <input type="reset" value="Clear">
        

    </form>
</body>
</html>
