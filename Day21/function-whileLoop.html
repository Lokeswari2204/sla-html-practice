    function q15()
    {
        let n = 153;
        let temp = n;
        let sum = 0;

        while(temp > 0)
        {
            let r = temp % 10;
            sum = sum + r * r * r;

        }

            console.log("Q15:", n + " is Armstrong");
        }
        else

            console.log("Q15:", n + " is Not Armstrong");
        }
    }
