<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Do While Loop Programs</title>
</head>
<body>

<script>

    // DO WHILE LOOP

    console.log("DO WHILE LOOP")


    // Q12: Factorial of a given number
    // 5! = 5 * 4 * 3 * 2 * 1 = 120

    let n12 = Number(prompt("Q12: Enter the number"));
    let fact = 1;
    let i = n12;

    do
    {
        fact = fact * i;
        i--;
    }
    while(i >= 1);

    console.log("Q12:", n12 + "! =", fact);


    // Q13: Find out the given number is Prime or Not

    let n13 = Number(prompt("Q13: Enter the number"));
    let ctr = 0;
    i = 1;

    do
    {
        if(n13 % i == 0)
        {
            ctr++;
        }

        i++;
    }
    while(i <= n13);

    if(ctr == 2)
    {
        console.log("Q13:", n13 + " is a prime number");
    }
    else
    {
        console.log("Q13:", n13 + " is not a prime number");
    }


    // Q14: Print the Prime Number Series

    let s14 = "";
    let n = 1;

    do
    {
        ctr = 0;
        i = 1;

        do
        {
            if(n % i == 0)
            {
                ctr++;
            }

            i++;
        }
        while(i <= n);

        if(ctr == 2)
        {
            s14 = s14 + n + " ";
        }

        n++;
    }
    while(n <= 100);

    console.log("Q14:", s14);


    // Q15: Find out the given number is Armstrong or Not
    // 153 = 1^3 + 5^3 + 3^3 = 153

    let n15 = Number(prompt("Q15: Enter the number"));
    let temp15 = n15;
    let sum15 = 0;
    let r15;

    do
    {
        r15 = temp15 % 10;
        sum15 = sum15 + r15 * r15 * r15;
        temp15 = parseInt(temp15 / 10);
    }
    while(temp15 > 0);

    if(sum15 == n15)
    {
        console.log("Q15:", n15 + " is an Armstrong number");
    }
    else
    {
        console.log("Q15:", n15 + " is not an Armstrong number");
    }


    // Q16: Print the Armstrong Number Series

    let s16 = "";
    n = 1;

    do
    {
        let temp = n;
        let sum = 0;
        let r;

        do
        {
            r = temp % 10;
            sum = sum + r * r * r;
            temp = parseInt(temp / 10);
        }
        while(temp > 0);

        if(sum == n)
        {
            s16 = s16 + n + " ";
        }

        n++;
    }
    while(n <= 1000);

    console.log("Q16:", s16);


    // Q17: Fibonacci Series
    // 0 1 1 2 3 5 8 13.....

    let s17 = "";
    let a = 0;
    let b = 1;
    i = 1;

    do
    {
        s17 = s17 + a + " ";

        let c = a + b;
        a = b;
        b = c;

        i++;
    }
    while(i <= 10);

    console.log("Q17:", s17);


    // Q18: Print the 5 Table
    // 1 * 5 = 5

    let s18 = "";
    i = 1;

    do
    {
        s18 = s18 + i + " * 5 = " + (i * 5) + "\n";
        i++;
    }
    while(i <= 10);

    console.log("Q18:\n" + s18);


    // Q19: Sum of Digits
    // Example: 123 = 1 + 2 + 3 = 6

    let n19 = Number(prompt("Q19: Enter the number"));
    let temp19 = n19;
    let sum19 = 0;
    let r19;

    do
    {
        r19 = temp19 % 10;
        sum19 = sum19 + r19;
        temp19 = parseInt(temp19 / 10);
    }
    while(temp19 > 0);

    console.log("Q19:", n19 + " = " + sum19);


    // Q20: Palindrome or Not
    // BAAB, MALAYALAM, MADAM

    let n20 = prompt("Q20: Enter the word");
    let reverse20 = "";
    i = n20.length - 1;

    do
    {
        reverse20 = reverse20 + n20[i];
        i--;
    }
    while(i >= 0);

    if(n20.toLowerCase() == reverse20.toLowerCase())
    {
        console.log("Q20:", n20 + " is a palindrome");
    }
    else
    {
        console.log("Q20:", n20 + " is not a palindrome");
    }

</script>

</body>
</html>
