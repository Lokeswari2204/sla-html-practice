<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
   <script>
        // Q1 Use push, pop, shift, unshift on an array.

        console.log("Q1");
        let arr = [2, 5, 7, 3, 6, 1, 9];
        console.log(arr);
        //push
        arr.push(8);
        console.log(arr);
        //pop
        arr.pop();
        console.log(arr);
        //shift
        arr.shift();
        console.log(arr);
        //unshift
        arr.unshift(4);
        console.log(arr);

        //Q2 Print all elements of an array using for loop.
        console.log("Q2");
        let arr2 = [10, 20, 30, 60, 35, 45,90];
        for(let i=0; i < arr2.length; i++)
        {
            console.log(arr2[i]);
        }

        //Q3 Use map to double all numbers in an array.
        let n3 = [2, 3, 4, 5, 6];
        let double = n3.map(n => n*2);
        console.log("Q3:", n3)
        console.log("Doubled Numbers:" , double);

        //Q4: Use filter to get even numbers from an array.
        let n4 = [4, 3, 7, 12, 18, 19, 15, 6];
        let even = n4.filter(n => n % 2 == 0)
        console.log("Q4:", n4)
        console.log("Even Numbers",even);

        //Q5 Use reduce to find the sum of an array.
        let n5 = [1,2,3,4,5];
        let result = n5.reduce((sum, n) => sum + n, 0);
        console.log("Q5:", n5)
        console.log("Sum of elements:", result);

        //Q6 Find the first number greater than 10.
        let n6 = [4, 9, 15, 10, 7, 30];
        let res = n6.find(n => n > 10);
        console.log("Q6:", n6);
        console.log("First number greater than 10: ", res);

        //Q7 Check if array includes a specific value.
        let n7 = ["Monday", "Wednesday", "Friday", "Saturday"];
        console.log("Q7:", n7);
        console.log("Friday -", n7.includes("Friday"));
        console.log("Thursday -", n7.includes("Thursday"));




   </script> 
</body>
</html>
