<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Loop Programs</title>
</head>
<body>

<script>
    // FOR LOOP

    console.log("FOR LOOP")
    // Q1: Series of 1 to 20
    let s1 = "";
    for(let i = 1; i <= 20; i++)
    {
        s1 = s1 + i + " ";
    }
    console.log(s1);


    // Q2: Odd series from 1 to 20
    let s2 = "";
    for(let i = 1; i <= 20; i += 2)
    {
        s2 = s2 + i + " ";
    }
    console.log(s2);


    // Q3: Even series from 0 to 20
    let s3 = "";
    for(let i = 0; i <= 20; i += 2)
    {
        s3 = s3 + i + " ";
    }
    console.log(s3);


    // Q4: 5 Series from 0 to 25
    let s4 = "";
    for(let i = 0; i <= 25; i += 5)
    {
        s4 = s4 + i + " ";
    }
    console.log(s4);


    // Q5: 1 + 2 + 3 + 4 + .....
    let s5 = "";
    for(let i = 1; i <= 10; i++)
    {
        if(i < 10)
            s5 = s5 + i + " + ";
        else
            s5 = s5 + i;
    }
    console.log(s5);


    // Q6: 0 + 2 + 4 + 6 + .....
    let s6 = "";
    for(let i = 0; i <= 10; i += 2)
    {
        if(i < 10)
            s6 = s6 + i + " + ";
        else
            s6 = s6 + i;
    }
    console.log(s6);


    // Q7: 1 + 3 + 5 + 7 + 9 + ....
    let s7 = "";
    for(let i = 1; i <= 9; i += 2)
    {
        if(i < 9)
            s7 = s7 + i + " + ";
        else
            s7 = s7 + i;
    }
    console.log(s7);


    // Q8: 0 + 5 + 10 + 15 + 20 + .....
    let s8 = "";
    for(let i = 0; i <= 25; i += 5)
    {
        if(i < 25)
            s8 = s8 + i + " + ";
        else
            s8 = s8 + i;
    }
    console.log(s8);


    // Q9: 1 / 1! + 2 / 2! + 3 / 3! + 4 / 4!.....
    let s9 = "";
    for(let i = 1; i <= 5; i++)
    {
        if(i < 5)
            s9 = s9 + i + " / " + i + "! + ";
        else
            s9 = s9 + i + " / " + i + "!";
    }
    console.log(s9);


    // Q10: 0 + 2 / 2! + 4 / 4! + 6 / 6!....
    let s10 = "";
    for(let i = 0; i <= 10; i += 2)
    {
        if(i < 10)
            s10 = s10 + i + " / " + i + "! + ";
        else
            s10 = s10 + i + " / " + i + "!";
    }
    console.log(s10);


    // Q11: 1 / 1! + 3 / 3! + 5 / 5!....
    let s11 = "";
    for(let i = 1; i <= 9; i += 2)
    {
        if(i < 9)
            s11 = s11 + i + " / " + i + "! + ";
        else
            s11 = s11 + i + " / " + i + "!";
    }
    console.log(s11);

</script>

</body>
</html>
