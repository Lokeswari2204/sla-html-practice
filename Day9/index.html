<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 9 - CSS Basics Assignment</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ID Selector -->
    <h1 id="header">CSS Basics</h1>

    <!-- Class Selector: intro -->
    <p class="intro">
        CSS is used to style HTML elements and make web pages attractive.
    </p>

    <!-- Element Selector -->
    <p>
        CSS selectors are used to select HTML elements and apply styles.
    </p>

    <!-- Class Selector: highlight -->
    <p class="highlight">
        This is an important highlighted paragraph.
    </p>

    <!-- Box Class -->
    <div class="box">
        <h2>CSS Selectors</h2>
        <p>
            We can use element, class, and ID selectors in CSS.
        </p>
    </div>

</body>
</html>
