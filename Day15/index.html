<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 15 Assignment</title>

    <style>

        /* Q1: 80% width but maximum 600px */
        .box {
            width: 80%;
            max-width: 600px;
            border: 2px solid black;
            padding: 10px;
        }

        /* Q2: Font size 1.5rem */
        p {
            font-size: 1.5rem;
        }
        /* 1.5* 16px = 24px */

        /* Q3: Heading using vw */
        .h3{
            font-size: 5vw;
        }
        /* 5% of the browsers window's width */

        /* Q4: Different font families and sizes */
        .font1 {
            font-family: Arial, sans-serif;
            font-size: 20px;
        }

        .font2 {
            font-family: Georgia, serif;
            font-size: 24px;
        }

        .font3 {
            font-family: "Courier New", monospace;
            font-size: 18px;
        }

        /* Q5: Background color below 768px */
        @media screen and (max-width: 767px) {
            body {
                background-color: lightblue;
            }
        }

        /* Q6: Background color for different devices */
        @media screen and (min-width: 768px) {
            body {
                background-color: blue;
            }
        }

        @media screen and (min-width: 992px) {
            body {
                background-color: tan;
            }
        }

        /* Q7: Responsive grid - 1, 2 and 4 columns */
        .grid-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }
        .grid-container div {
            border: 2px solid black;
            background-color: lightgray;
            padding: 20px;
            text-align: center;
        }

        @media screen and (min-width: 768px) {
            .grid-container {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media screen and (min-width: 992px) {
            .grid-container {
                grid-template-columns: repeat(4, 1fr);
            }
        }

    </style>
</head>

<body>

    <h1> Day 15 - Assignment </h1>

    <!-- Q1 -->
    <div class="box">
        This is Q1 box.
    </div>

    <!-- Q2 -->
    <p>This is Q2 paragraph.</p>

    <!-- Q3 -->
    <h3>Responsive Heading</h3>

    <!-- Q4 -->
    <p class="font1">This is Arial font.</p>
    <p class="font2">This is Georgia font.</p>
    <p class="font3">This is Courier New font.</p>

    <!-- Q5 & Q6 -->
    <p>Resize the browser window to see the background color change.</p>

    <!-- Q7 -->
    <div class="grid-container">
        <div>Box 1</div>
        <div>Box 2</div>
        <div>Box 3</div>
        <div>Box 4</div>
        <div>Box 5</div>
        <div>Box 6</div>
        <div>Box 7</div>
        <div>Box 8</div>
    </div>

</body>
</html>
